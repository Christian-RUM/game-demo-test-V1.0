  .end-btns { display: flex; gap: 12px; }

const BGM_TRACKS = { daily: "bgm_daily", suspense: "bgm_suspense", sad: "bgm_sad", warm: "bgm_warm", holy: "bgm_holy" };
const BGM_VOLUME = { daily: 0.15, suspense: 1.0, sad: 0.5, warm: 0.5, holy: 0.5 };
const SCENE_BGM = {
  cafe: "suspense", bar: "sad", bar_goddess: "holy", goddess: "holy", home: "daily",
  explosion: "suspense", explosion_after: "sad", park_empty: "daily", park: "daily",
  street: "suspense", matsu: "warm", police: "warm"
};
const bgmEl = new Audio();
const seCache = [];
let currentBgm = null;
let currentBgmVol = 0.55;
let audioEnabled = true;

function fadeOut(audio, duration, callback) {
  const startVol = audio.volume;
  const start = performance.now();
  const step = () => {
    const t = (performance.now() - start) / duration;
    if (t >= 1) {
      audio.pause();
      if (callback) callback();
      return;
    }
    audio.volume = startVol * (1 - t);
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function fadeIn(audio, targetVol, duration) {
  audio.volume = 0;
  const start = performance.now();
  const step = () => {
    const t = (performance.now() - start) / duration;
    if (t >= 1) { audio.volume = targetVol; return; }
    audio.volume = targetVol * t;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function playBgm(track) {
  const name = BGM_TRACKS[track];
  if (!name || name === currentBgm) return;
  currentBgm = name;
  currentBgmVol = (BGM_VOLUME[track] !== undefined) ? BGM_VOLUME[track] : 0.55;
  if (!audioEnabled) return;
  const startNew = () => {
    bgmEl.src = "audio/" + name + ".mp3";
    bgmEl.loop = true;
    bgmEl.play().catch(() => {});
    fadeIn(bgmEl, currentBgmVol, 3000);
  };
  if (bgmEl.src && !bgmEl.paused) {
    fadeOut(bgmEl, 500, startNew);
  } else {
    startNew();
  }
}

function playSe(name) {
  if (!audioEnabled) return;
  const a = new Audio("audio/" + name + ".mp3");
  a.volume = 0.9;
  a.play().catch(() => {});
  seCache.push(a);
  a.onended = () => {
    const i = seCache.indexOf(a);
    if (i >= 0) seCache.splice(i, 1);
  };
  if (seCache.length > 12) seCache.shift();
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  btnAudio.textContent = audioEnabled ? "音" : "静音";
  if (audioEnabled) {
    if (currentBgm) {
      bgmEl.src = "audio/" + currentBgm + ".mp3";
      bgmEl.loop = true;
      bgmEl.play().catch(() => {});
      fadeIn(bgmEl, currentBgmVol, 800);
    }
  } else {
    bgmEl.pause();
  }
}

function updateHud() {
  hud.matsu.textContent = state.matsu;
  hud.hagiwara.textContent = state.hagiwara;
  hud.mianzi.textContent = state.mianzi;
  hud.zhenxin.textContent = state.zhenxin;
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 1400);
}

function effectLabel(e) {
  const parts = [];
  if (e.matsu) parts.push("松田好感 " + (e.matsu > 0 ? "+" : "") + e.matsu);
  if (e.hagiwara) parts.push("研二好感 " + (e.hagiwara > 0 ? "+" : "") + e.hagiwara);
  if (e.mianzi) parts.push("面子 " + (e.mianzi > 0 ? "+" : "") + e.mianzi);
  if (e.zhenxin) parts.push("真心 " + (e.zhenxin > 0 ? "+" : "") + e.zhenxin);
  return parts.join("  ");
}

function applyEffects(e) {
  for (const k in e) { if (k in state) state[k] += e[k]; }
  updateHud();
  const label = effectLabel(e);
  if (label) toast(label);
}

function setScene(key) {
  currentSceneKey = key;
  sceneEl.textContent = SCENES[key] || "—";
  stage.style.background = BG[key] || "linear-gradient(160deg, #fdf6f0, #e8d8d0)";
  const f = BG_FILE[key];
  bgLayer.style.backgroundImage = f ? "url('images/" + f + "')" : "";
  playBgm(SCENE_BGM[key]);
}

function setPortrait(name, expr) {
  if (!name || NO_PORTRAIT[name]) {
    lastPortrait = null;
    portraitEl.classList.add("hidden");
    portraitEl.innerHTML = "";
    return;
  }
  const key = name + "|" + (expr || "default");
  if (key === lastPortrait) return;
  lastPortrait = key;
  const path = portraitPath(name, expr);
  if (!path) {
    portraitEl.innerHTML = portraitSVG(name);
    portraitEl.classList.remove("hidden");
    return;
  }
  const img = new Image();
  img.draggable = false;
  img.onload = () => { portraitEl.innerHTML = ""; portraitEl.appendChild(img); };
  img.onerror = () => { portraitEl.innerHTML = portraitSVG(name); };
  img.src = path;
  portraitEl.classList.remove("hidden");
}

function lineMeta(item) {
  if (item.t === "d") return { label: item.n, color: COLORS[item.n] || "#fff", cls: "dialogue" };
  if (item.t === "os") return { label: "松阪梅（内心）", color: "#b48ad9", cls: "os" };
  return { label: "旁白", color: "#9a8b94", cls: "narration" };
}

function pushHistory(label, color, text) {
  history.push({ label: label, color: color, text: text });
}

function stopTyping() {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  typing = false;
}

function startTyping(text) {
  const span = document.createElement("span");
  textEl.appendChild(span);
  const caret = document.createElement("span");
  caret.className = "caret";
  caret.textContent = "▎";
  textEl.appendChild(caret);
  currentSpan = span;
  currentFull = text;
  typing = true;
  let i = 0;
  typeTimer = setInterval(() => {
    if (i >= text.length) {
      stopTyping();
      caret.remove();
      return;
    }
    span.textContent = text.slice(0, ++i);
  }, 24);
}

function finishTyping() {
  if (!typing) return;
  stopTyping();
  if (currentSpan) currentSpan.textContent = currentFull;
  const caret = textEl.querySelector(".caret");
  if (caret) caret.remove();
}

function showLine(item) {
  let speaker = null;
  if (item.t === "d") speaker = item.n;
  else if (item.t === "os") speaker = "松阪梅";
  else if (item.p) speaker = item.p;
  setPortrait(speaker, item.e);
  const meta = lineMeta(item);
  pushHistory(meta.label, meta.color, item.x);
  nameTag.textContent = meta.label;
  nameTag.style.borderLeftColor = meta.color;
  textEl.className = meta.cls;
  textEl.innerHTML = "";
  startTyping(item.x);
}

function showChoice(item) {
  setPortrait(item.p || "松阪梅", item.e || "自信微笑");
  dialogEl.classList.add("hidden");
  choicesEl.classList.remove("hidden");
  choicesEl.innerHTML = "";
  const q = document.createElement("div");
  q.className = "q";
  q.textContent = "—— " + item.q + " ——";
  choicesEl.appendChild(q);
  item.opts.forEach((opt) => {
    const btn = document.createElement("button");
    btn.textContent = opt.a;
    btn.onclick = () => {
      choicesEl.classList.add("hidden");
      choicesEl.innerHTML = "";
      dialogEl.classList.remove("hidden");
      playSe("choice");
      applyEffects(opt.e || {});
      pending = pending.concat(opt.r || []);
      next();
    };
    choicesEl.appendChild(btn);
  });
}

function next() {
  if (flashing || sleeping) return;
  if (typing) { finishTyping(); return; }
  let item;
  if (pending.length > 0) item = pending.shift();
  else if (cursor < story.length) item = story[cursor++];
  else return;

  if (!item) { next(); return; }
  if (item.scene) { setScene(item.scene); next(); return; }
  if (item.t === "bgm") { playBgm(item.v); next(); return; }
  if (item.t === "se") { playSe(item.v); next(); return; }
  if (item.t === "end") { setPortrait(null); dialogEl.classList.add("hidden"); renderSettlement(); endingEl.classList.remove("hidden"); return; }
  if (item.t === "flash") {
    playSe("flash");
    flashing = true;
    flashEl.classList.add("run");
    setTimeout(() => {
      flashEl.classList.remove("run");
      flashing = false;
      next();
    }, 550);
    return;
  }
  if (item.t === "sleep") {
    sleeping = true;
    sleepEl.classList.remove("hidden");
    setTimeout(() => {
      sleepEl.classList.add("hidden");
      sleeping = false;
      next();
    }, 1100);
    return;
  }
  if (item.t === "cg") {
    playSe("cg");
    markCgViewed(item.img);
    cgFromGallery = false;
    cgImg.src = "images/" + item.img;
    cgEl.classList.remove("hidden");
    cgOpen = true;
    return;
  }
  if (item.t === "c") { showChoice(item); return; }
  dialogEl.classList.remove("hidden");
  showLine(item);
}

const SAVE_KEY = "matsuzaka_save_slots";
let slots = [];
let slotMode = "save";

function loadSlots() {
  try { slots = JSON.parse(localStorage.getItem(SAVE_KEY) || "[]"); } catch (e) { slots = []; }
  if (!Array.isArray(slots)) slots = [];
  while (slots.length < 3) slots.push(null);
  slots = slots.slice(0, 3);
}

function persistSlots() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(slots)); } catch (e) {}
}

function canOpenSlots() {
  return titleEl.classList.contains("hidden")
    && endingEl.classList.contains("hidden")
    && choicesEl.classList.contains("hidden")
    && !typing && !flashing && !sleeping && !cgOpen;
}

function saveSlot(i) {
  const last = history.length ? history[history.length - 1] : null;
  slots[i] = {
    cursor: cursor,
    pending: pending.slice(),
    state: { matsu: state.matsu, hagiwara: state.hagiwara, mianzi: state.mianzi, zhenxin: state.zhenxin },
    history: history.slice(),
    sceneKey: currentSceneKey,
    preview: (last ? last.label + "：" + last.text : "").slice(0, 30),
    time: new Date().toLocaleString()
  };
  persistSlots();
}

function loadSlot(i) {
  const s = slots[i];
  if (!s) return;
  stopTyping();
  cursor = s.cursor;
  pending = s.pending.slice();
  state.matsu = s.state.matsu; state.hagiwara = s.state.hagiwara; state.mianzi = s.state.mianzi; state.zhenxin = s.state.zhenxin;
  history = s.history.slice();
  lastPortrait = null;
  updateHud();
  textEl.innerHTML = "";
  setScene(s.sceneKey);
  dialogEl.classList.remove("hidden");
  choicesEl.classList.add("hidden");
  choicesEl.innerHTML = "";
  cgEl.classList.add("hidden"); cgOpen = false;
  sleepEl.classList.add("hidden"); sleeping = false;
  flashEl.classList.remove("run"); flashing = false;
  slotsEl.classList.add("hidden");
  titleEl.classList.add("hidden");
  endingEl.classList.add("hidden");
  next();
}

function renderSlots() {
  slotList.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const s = slots[i];
    const btn = document.createElement("button");
    btn.className = "slot-btn";
    const num = document.createElement("span");
    num.className = "snum";
    num.textContent = "存档位 " + (i + 1) + (s ? " · " + s.time : "");
    btn.appendChild(num);
    const prev = document.createElement("span");
    prev.className = "sprev";
    prev.textContent = s ? (s.preview || "（空）") : "（空）";
    btn.appendChild(prev);
    btn.onclick = () => {
      if (slotMode === "save") { saveSlot(i); renderSlots(); }
      else { loadSlot(i); }
    };
    slotList.appendChild(btn);
  }
  slotsEl.classList.remove("hidden");
}

function openSave() {
  if (!canOpenSlots()) return;
  slotMode = "save"; slotsTitle.textContent = "存档"; renderSlots();
}

function openLoad() {
  if (!canOpenSlots()) return;
  slotMode = "load"; slotsTitle.textContent = "读档"; renderSlots();
}

];
let cgViewed = {};
let galleryReturn = "title";

function loadCgViewed() {
  try { cgViewed = JSON.parse(localStorage.getItem("matsuzaka_cg_viewed") || "{}"); } catch (e) { cgViewed = {}; }
}

function persistCgViewed() {
  try { localStorage.setItem("matsuzaka_cg_viewed", JSON.stringify(cgViewed)); } catch (e) {}
}

function markCgViewed(file) {
  cgViewed[file] = true;
  persistCgViewed();
}

function settlementComment() {
  const m = state.matsu;
  if (m >= 5) return "松田先生看你的眼神，似乎有些不一样了……";
  if (m >= 3) return "你们之间，已经有了一点微妙的默契。";
  if (m >= 1) return "你和松田先生，还只是刚刚认识。";
  return "这一章，你似乎和松田先生擦肩而过了。";
}

function renderSettlement() {
  document.getElementById("s-matsu").textContent = state.matsu;
  document.getElementById("s-hagiwara").textContent = state.hagiwara;
  document.getElementById("s-mianzi").textContent = state.mianzi;
  document.getElementById("s-zhenxin").textContent = state.zhenxin;
  document.getElementById("s-comment").textContent = settlementComment();
}

function renderGallery() {
  galleryList.innerHTML = "";
  CG_LIST.forEach((cg) => {
    const cell = document.createElement("div");
    cell.className = "cg-cell";
    if (cgViewed[cg.file]) {
      const img = document.createElement("img");
      img.src = "images/" + cg.file;
      cell.appendChild(img);
      cell.onclick = () => {
        cgFromGallery = true;
        cgImg.src = "images/" + cg.file;
        cgEl.classList.remove("hidden");
        cgOpen = true;
      };
    } else {
      const lock = document.createElement("div");
      lock.className = "lock";
      lock.textContent = "？";
      cell.appendChild(lock);
    }
    const cname = document.createElement("div");
    cname.className = "cname";
    cname.textContent = cg.name;
    cell.appendChild(cname);
    galleryList.appendChild(cell);
  });
  galleryEl.classList.remove("hidden");
}

function openGallery(from) {
  galleryReturn = from;
  titleEl.classList.add("hidden");
  endingEl.classList.add("hidden");
  renderGallery();
}

function closeGallery() {
  galleryEl.classList.add("hidden");
  if (galleryReturn === "ending") { endingEl.classList.remove("hidden"); }
  else { titleEl.classList.remove("hidden"); }
  galleryReturn = "title";
}

function reset() {
  stopTyping();
  cursor = 0;
  pending = [];
  flashing = false;
  sleeping = false;
  cgOpen = false;
  cgFromGallery = false;
  history = [];
  state.matsu = 0; state.hagiwara = 0; state.mianzi = 0; state.zhenxin = 0;
  lastPortrait = null;
  updateHud();
  sceneEl.textContent = "—";
  stage.style.background = "linear-gradient(160deg, #fdf6f0, #e8d8d0)";
  bgLayer.style.backgroundImage = "";
  textEl.innerHTML = "";
  portraitEl.classList.add("hidden");
  portraitEl.innerHTML = "";
  dialogEl.classList.add("hidden");
  choicesEl.classList.add("hidden");
  choicesEl.innerHTML = "";
  flashEl.classList.remove("run");
  sleepEl.classList.add("hidden");
  cgEl.classList.add("hidden");
  backlogEl.classList.add("hidden");
  endingEl.classList.add("hidden");
  titleEl.classList.remove("hidden");
}

stage.addEventListener("click", () => {
  if (cgOpen) {
    cgEl.classList.add("hidden"); cgOpen = false;
    if (!cgFromGallery) { next(); } else { cgFromGallery = false; }
    return;
  }
  if (!titleEl.classList.contains("hidden") || !endingEl.classList.contains("hidden")) return;
  if (!galleryEl.classList.contains("hidden")) return;
  if (!slotsEl.classList.contains("hidden")) return;
  if (!backlogEl.classList.contains("hidden")) return;
  if (choicesEl.classList.contains("hidden")) next();
});

document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    if (cgOpen) {
      cgEl.classList.add("hidden"); cgOpen = false;
      if (!cgFromGallery) { next(); } else { cgFromGallery = false; }
      return;
    }
    if (!galleryEl.classList.contains("hidden")) { closeGallery(); return; }
    if (!slotsEl.classList.contains("hidden")) { slotsEl.classList.add("hidden"); return; }
    if (!backlogEl.classList.contains("hidden")) { closeBacklog(); return; }
    if (!titleEl.classList.contains("hidden")) { start(); return; }
    if (!endingEl.classList.contains("hidden")) { return; }
    if (choicesEl.classList.contains("hidden")) next();
  }
});

function start() {
  titleEl.classList.add("hidden");
  cursor = 0;
  next();
}

document.getElementById("btn-start").onclick = start;
document.getElementById("btn-restart").onclick = reset;
document.getElementById("btn-log").onclick = openBacklog;
document.getElementById("btn-log-close").onclick = closeBacklog;
document.getElementById("btn-save").onclick = openSave;
document.getElementById("btn-load").onclick = openLoad;
document.getElementById("btn-slot-close").onclick = () => slotsEl.classList.add("hidden");
document.getElementById("btn-audio").onclick = toggleAudio;
document.getElementById("btn-gallery-title").onclick = () => openGallery("title");
document.getElementById("btn-gallery-end").onclick = () => openGallery("ending");
document.getElementById("btn-gallery-close").onclick = closeGallery;
loadSlots();
loadCgViewed();
updateHud();
</script>
</body>
</html>
